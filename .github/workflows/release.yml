name: Release

# Builds installers for macOS (Apple Silicon and Intel), Linux and Windows.
#
# - Push to main: after CI passes, the packages replace the assets of the rolling
#   "Latest main build" pre-release (tag `main-build`).
# - Push a vX.Y.Z tag: the packages go into a draft release for that version,
#   with the matching CHANGELOG.md section as release notes.
# - Manual run: the packages are only kept as workflow artifacts.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer main build supersedes an older one; version releases always run to completion.
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

env:
  CARGO_TERM_COLOR: always
  MAIN_BUILD_TAG: main-build

jobs:
  prepare:
    name: Prepare release
    # Main builds only run for successful CI runs of pushes, never for pull requests.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check versions
        run: node .github/scripts/check-version.mjs "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Create or refresh the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          release_id_for() {
            # The releases list includes drafts, which the by-tag endpoint does not.
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$1\") | .id" | head -n1
          }
          # Creates a release and prints its id. The id comes from the response because a
          # release only shows up in the releases list some time after it was created.
          create_release() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --jq .id "$@"
          }

          case "$EVENT" in
            workflow_run)
              # Replace the rolling pre-release so its tag and assets match this commit.
              gh release delete "$MAIN_BUILD_TAG" --cleanup-tag --yes || true
              {
                echo "Automated build of \`main\` at ${SHA:0:7}. Not a stable release: packages are replaced on every push to \`main\`."
                echo
                if notes=$(node .github/scripts/changelog-section.mjs Unreleased); then
                  echo "## Unreleased changes"
                  echo
                  echo "$notes"
                fi
              } > notes.md
              id=$(create_release -f tag_name="$MAIN_BUILD_TAG" -f target_commitish="$SHA" \
                -f name="Latest main build" -F body=@notes.md -F prerelease=true -f make_latest=false)
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              ;;
            push)
              id=$(release_id_for "$TAG")
              if [ -z "$id" ]; then
                args=(-f tag_name="$TAG" -f name="grit $TAG" -F draft=true)
                [[ "$TAG" == *-* ]] && args+=(-F prerelease=true)
                if node .github/scripts/changelog-section.mjs "${TAG#v}" > notes.md; then
                  args+=(-F body=@notes.md)
                else
                  echo "::warning::No CHANGELOG.md section for ${TAG#v}; using generated notes"
                  args+=(-F generate_release_notes=true)
                fi
                id=$(create_release "${args[@]}")
              fi
              [ -n "$id" ] || { echo "::error::Could not find or create the release for $TAG"; exit 1; }
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Manual run: packages are uploaded as workflow artifacts only."
              ;;
          esac

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu keeps the glibc requirement of the binaries low.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: ./.github/scripts/install-linux-deps.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Code signing: add these repository secrets to sign the macOS packages. They are only
      # exported when a certificate is configured: Tauri treats a set-but-empty
      # APPLE_CERTIFICATE as a certificate to import, which fails the build.
      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret; building unsigned macOS packages."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -z "$value" ] && continue
            delimiter="EOF_$RANDOM$RANDOM"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Empty for manual runs: nothing is uploaded to a release.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadWorkflowArtifacts: true
          retryAttempts: 1

      # Tauri notarizes the app bundle but not the DMG around it, and Gatekeeper rejects a
      # signed DMG that isn't notarized. Notarize and staple the DMG, then replace the copies
      # tauri-action already uploaded to the release and as a workflow artifact.
      - name: Notarize macOS DMG
        id: dmg
        if: runner.os == 'macOS' && env.APPLE_PASSWORD != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir="src-tauri/target/$TARGET/release/bundle/dmg"
          dmgs=("$dir"/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected one DMG in $dir, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          name=$(basename "$dmg")
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")

          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)
          echo "$result"
          if [ "$(jq -r .status <<< "$result")" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" "${auth[@]}" || true
            echo "::error::Apple did not accept the notarization of $name"
            exit 1
          fi

          # The ticket can take a moment to become available after notarization.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" -eq 5 ] && exit 1
            sleep 15
          done
          spctl --assess -vv --type open --context context:primary-signature "$dmg"

          if [ -n "$RELEASE_ID" ]; then
            assets="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"
            asset_id=$(gh api "$assets" --paginate --jq ".[] | select(.name == \"$name\") | .id")
            if [ -n "$asset_id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
            gh api -X POST -H "Content-Type: application/octet-stream" --input "$dmg" --silent \
              "https://uploads.github.com/$assets?name=$name"
          fi

          # tauri-action names its artifacts darwin-<arch>-dmg, with x64 for Intel.
          case "$TARGET" in
            aarch64-*) arch=aarch64 ;;
            *) arch=x64 ;;
          esac
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "artifact=darwin-$arch-dmg" >> "$GITHUB_OUTPUT"

      - name: Replace the DMG workflow artifact
        if: steps.dmg.outputs.path != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.artifact }}
          path: ${{ steps.dmg.outputs.path }}
          overwrite: true
