[package]
name = "grit"
version = "0.4.1"
description = "A cross-platform interactive Git client"
authors = ["Sascha Raesch <sascha.raesch@gmail.com>"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "grit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.7"
dunce = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
